# Optional local aliases for gcploc service targets.
#
# This file is an example only. Copy it to .gcploc.aliases.toml (gitignored)
# and customize for your machine. Do not commit real project or product names.
#
# Or point elsewhere with:
#   export GCPLOC_ALIASES_FILE=/path/to/aliases.toml
#
# Valid targets: services, pubsub, gcs, cloudtasks, firestore, spanner,
#                bigtable, secretmanager, cp

[aliases]
# Start a common subset:
# myapp = ["pubsub", "gcs"]
#
# Storage + async workers:
# workers = ["gcs", "cloudtasks"]
#
# Everything including the control panel:
# full = ["services", "cp"]
